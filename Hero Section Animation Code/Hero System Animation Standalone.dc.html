<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1040,&quot;height&quot;:700},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF5B61&quot;,&quot;options&quot;:[&quot;#FF5B61&quot;,&quot;#E8474D&quot;,&quot;#12212E&quot;,&quot;#1E8E62&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;logoSrc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/funnelcake-mark.jpeg&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;idleHold&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:6,&quot;min&quot;:2,&quot;max&quot;:14,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;loop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
const GEO = {
  wide: {
    vb: "0 0 1000 620", c: [500, 310], scale: 1, discR: 46, rings: [92, 142, 192],
    tangle: "",
    chaos: [[150, 92], [770, 70], [888, 300], [706, 522], [236, 470], [112, 282]],
    orbit: [[252, 168], [500, 86], [500, 534], [252, 452], [748, 452], [748, 168]]
  },
  narrow: {
    vb: "0 0 1000 980", c: [500, 470], scale: 1.45, discR: 68, rings: [150, 228, 306],
    tangle: "translate(500,470) scale(1,1.55) translate(-500,-310)",
    chaos: [[250, 130], [730, 190], [790, 700], [300, 830], [230, 530], [760, 420]],
    orbit: [[250, 250], [500, 110], [500, 830], [250, 690], [750, 690], [750, 250]]
  }
};

const BOW = [-1, 1, -1, 1, -1, 1];
const WILD = [[-120, 70], [90, -130], [-140, -60], [60, 140], [-70, 130], [130, -80]];

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutQ = t => 1 - Math.pow(1 - t, 5);
const smooth = t => { const x = clamp01(t); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;

class Component extends DCLogic {
  svgRefObj = React.createRef();

  renderVals() {
    return { svgRef: this.svgRefObj };
  }

  componentDidMount() {
    const s = this.svgRefObj.current || document.querySelector("[data-fc-anim]");
    if (!s) return;
    this.s = s;
    const qa = sel => Array.prototype.slice.call(s.querySelectorAll(sel));
    this.cards = qa("[data-card]").sort((a, b) => +a.dataset.card - +b.dataset.card);
    this.warns = this.cards.map(c => c.querySelector("[data-warn]"));
    this.bads = this.cards.map(c => c.querySelector("[data-bad]"));
    this.goods = this.cards.map(c => c.querySelector("[data-good]"));
    this.links = qa("[data-link]");
    this.tangle = s.querySelector("[data-tangle]");
    this.ringsG = s.querySelector("[data-rings]");
    this.ringEls = qa("[data-ring]");
    this.dots = qa("[data-odot]");
    this.logo = s.querySelector("[data-logo]");
    this.logoImg = s.querySelector("[data-logo-img]");
    this.disc = s.querySelector("[data-disc]");
    this.ripple = s.querySelector("[data-ripple]");

    const accent = this.props.accent;
    if (accent) qa("[data-accent]").forEach(el => el.setAttribute(el.dataset.accent, accent));
    const lsrc = (window.__resources && window.__resources.fcMark) || this.props.logoSrc;
    if (lsrc) this.logoImg.setAttribute("href", lsrc);

    const hold = this.props.idleHold ?? 6;
    this.T = { chaos: 2, freeze: 0.3, logoIn: 2.3, logoDur: 0.42, t0: 2.66, stag: 0.1, dur: 1.32, rings: 4.1, ringsDur: 0.9 };
    this.settle = this.T.t0 + 5 * this.T.stag + this.T.dur + 0.35;
    this.idleEnd = this.settle + hold;
    this.scatter = 1.45;
    this.LOOP = this.idleEnd + this.scatter;
    this.pulses = [this.T.t0 + 0.02, this.settle + hold * 0.45];

    this.reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    this.layout();
    this.onResize = () => { clearTimeout(this._rt); this._rt = setTimeout(() => this.layout(true), 150); };
    window.addEventListener("resize", this.onResize);

    this.start = performance.now();
    if (this.reduce) { this.paint(this.settle + 0.4, 0); return; }
    const tick = now => {
      this.raf = requestAnimationFrame(tick);
      const abs = (now - this.start) / 1000;
      let t = abs;
      if (this.props.loop === false) t = Math.min(abs, this.idleEnd);
      else t = abs % this.LOOP;
      this.paint(t, abs);
    };
    this.raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener("resize", this.onResize);
    clearTimeout(this._rt);
  }

  layout(repaint) {
    const w = this.s.getBoundingClientRect().width || 1000;
    const g = w < 640 ? GEO.narrow : GEO.wide;
    if (this.g === g && !repaint) return;
    this.g = g;
    this.s.setAttribute("viewBox", g.vb);
    this.tangle.setAttribute("transform", g.tangle);
    this.ringEls.forEach((r, i) => {
      r.setAttribute("cx", g.c[0]); r.setAttribute("cy", g.c[1]); r.setAttribute("r", g.rings[i]);
    });
    this.disc.setAttribute("cx", g.c[0]); this.disc.setAttribute("cy", g.c[1]); this.disc.setAttribute("r", g.discR);
    this.ripple.setAttribute("cx", g.c[0]); this.ripple.setAttribute("cy", g.c[1]);
    const iw = g.discR * 0.82, ih = iw / 0.697;
    this.logoImg.setAttribute("x", g.c[0] - iw / 2);
    this.logoImg.setAttribute("y", g.c[1] - ih / 2);
    this.logoImg.setAttribute("width", iw);
    this.logoImg.setAttribute("height", ih);
    if (this.reduce) this.paint(this.settle + 0.4, 0);
  }

  paint(t, abs) {
    const g = this.g, T = this.T, C = g.c;
    const sp = smooth((t - this.idleEnd) / this.scatter);
    const scat = easeInOut(clamp01((t - this.idleEnd) / this.scatter));

    // chaos wobble amplitude: alive, then damped to a held beat, then back on scatter
    let amp = t < T.chaos ? 1 : 1 - clamp01((t - T.chaos) / T.freeze);
    amp = Math.max(amp, sp);

    for (let i = 0; i < 6; i++) {
      let p = clamp01((t - (T.t0 + i * T.stag)) / T.dur);
      p = easeInOut(p);
      if (t >= this.idleEnd) p = 1 - scat;

      const A = g.chaos[i], B = g.orbit[i];
      const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
      const dx = B[0] - A[0], dy = B[1] - A[1];
      const len = Math.hypot(dx, dy) || 1;
      const bow = BOW[i] * Math.min(len * 0.22, 130);
      const cx = mx + (-dy / len) * bow, cy = my + (dx / len) * bow;
      const q = 1 - p;
      let x = q * q * A[0] + 2 * q * p * cx + p * p * B[0];
      let y = q * q * A[1] + 2 * q * p * cy + p * p * B[1];

      x += amp * (3.4 * Math.sin(abs * 0.83 + i * 1.7) + 1.7 * Math.sin(abs * 1.61 + i * 2.9));
      y += amp * (3.0 * Math.sin(abs * 0.71 + i * 2.3) + 1.5 * Math.sin(abs * 1.43 + i));
      const settled = p > 0.995 ? 1 : 0;
      y += settled * 2.4 * Math.sin(abs * 0.72 + i * 1.25);
      x += settled * 1.4 * Math.sin(abs * 0.55 + i * 2.1);

      this.cards[i].setAttribute("transform", "translate(" + x.toFixed(2) + "," + y.toFixed(2) + ") scale(" + g.scale + ")");

      const good = smooth((p - 0.93) / 0.07);
      this.goods[i].setAttribute("opacity", good.toFixed(3));
      this.bads[i].setAttribute("opacity", (1 - good).toFixed(3));
      this.warns[i].setAttribute("opacity", (1 - smooth(p / 0.3)).toFixed(3));

      // connection line: tangled, then straight
      const w = 1 - p;
      const t1x = lerp(x, C[0], 0.34), t1y = lerp(y, C[1], 0.34);
      const t2x = lerp(x, C[0], 0.68), t2y = lerp(y, C[1], 0.68);
      const c1x = t1x + WILD[i][0] * w, c1y = t1y + WILD[i][1] * w;
      const c2x = t2x - WILD[i][0] * 0.7 * w, c2y = t2y - WILD[i][1] * 0.7 * w;
      this.links[i].setAttribute("d", "M" + x.toFixed(1) + " " + y.toFixed(1) + " C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + "," + c2x.toFixed(1) + " " + c2y.toFixed(1) + "," + C[0] + " " + C[1]);
      this.links[i].setAttribute("opacity", (0.9 - 0.42 * p).toFixed(3));
    }

    // background tangle dissolves as the system connects
    let tang = 1 - smooth((t - (T.t0 - 0.1)) / 1.15);
    tang = Math.max(tang, sp);
    this.tangle.setAttribute("opacity", (tang * 0.95).toFixed(3));
    const drift = amp * 2.2;
    this.tangle.setAttribute("transform", (g.tangle ? g.tangle + " " : "") + "translate(" + (drift * Math.sin(abs * 0.4)).toFixed(2) + "," + (drift * Math.sin(abs * 0.31 + 1)).toFixed(2) + ")");

    // logo: 90% → 100% with a soft fade, then breathes
    const li = easeOut(clamp01((t - T.logoIn) / T.logoDur));
    let lo = li;
    if (t >= this.idleEnd) lo = 1 - smooth((t - (this.idleEnd + 0.35)) / 0.6);
    let k = lerp(0.9, 1, li);
    if (t > this.settle) k *= 1 + 0.006 * Math.sin((abs) * 1.15);
    this.logo.setAttribute("opacity", lo.toFixed(3));
    this.logo.setAttribute("transform", "translate(" + C[0] + "," + C[1] + ") scale(" + k.toFixed(4) + ") translate(" + -C[0] + "," + -C[1] + ")");

    // one ripple on landing, one slow pulse mid-idle
    let rR = g.discR, rO = 0;
    for (const p0 of this.pulses) {
      const u = clamp01((t - p0) / 1.1);
      if (u > 0 && u < 1) {
        const e = easeOutQ(u);
        rR = g.discR + e * g.discR * 1.7;
        rO = 0.42 * (1 - u) * (1 - u);
      }
    }
    this.ripple.setAttribute("r", rR.toFixed(1));
    this.ripple.setAttribute("opacity", rO.toFixed(3));

    // orbit rings + travelling coral dots
    let ro = smooth((t - T.rings) / T.ringsDur);
    if (t >= this.idleEnd) ro *= 1 - smooth((t - this.idleEnd) / 0.5);
    const pulse = 1 + 0.012 * Math.sin(abs * 0.9);
    const rs = lerp(0.94, 1, smooth((t - T.rings) / T.ringsDur)) * pulse;
    this.ringsG.setAttribute("opacity", ro.toFixed(3));
    this.ringsG.setAttribute("transform", "translate(" + C[0] + "," + C[1] + ") scale(" + rs.toFixed(4) + ") translate(" + -C[0] + "," + -C[1] + ")");
    const map = [0, 1, 1, 2], sped = [0.30, -0.19, 0.22, -0.14], ph = [0, 1.9, 4.1, 2.7];
    this.dots.forEach((d, i) => {
      const r = g.rings[map[i]], a = abs * sped[i] + ph[i];
      d.setAttribute("cx", (C[0] + r * Math.cos(a)).toFixed(2));
      d.setAttribute("cy", (C[1] + r * Math.sin(a)).toFixed(2));
    });
  }
}
</script>
